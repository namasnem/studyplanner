<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Study planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;box-sizing:border-box;
  --bg:#f7f7f4; --s1:#fdfdfb; --s2:#ebebe6; --line:#d2d2cb; --line2:#d2d2cb; --nav:#f7f7f4;
  --ink:#1a1a1a; --ink2:#333333; --ink3:#595959; --inv:#1a1a1a; --oninv:#f7f7f4;
  --red:#c4001a; --orange:#b34700; --amber:#8a5300; --blue:#0044cc; --green:#1a1a1a; --grn:#1f7a3d; --pink:#b0105f; --purple:#6a2fb8; --teal:#00706a;
  --redline:#c4001a; --focus:#0044cc;
  --f:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --navh:64px; --hh:61px; --minih:0px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#141414; --s1:#1a1a1a; --s2:#262626; --line:#3a3a3a; --line2:#3a3a3a; --nav:#141414;
  --ink:#e8e8e8; --ink2:#cfcfcf; --ink3:#aaaaaa; --inv:#e8e8e8; --oninv:#141414;
  --red:#ff6b6b; --orange:#ff9d4d; --amber:#ffc24d; --blue:#7db8ff; --green:#e8e8e8; --grn:#6fcf8a; --pink:#ff9ad3; --purple:#c9a0ff; --teal:#3ee0cf;
  --redline:#ff6b6b; --focus:#ffc24d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --s1:#1a1a1a; --s2:#262626; --line:#3a3a3a; --line2:#3a3a3a; --nav:#141414;
  --ink:#e8e8e8; --ink2:#cfcfcf; --ink3:#aaaaaa; --inv:#e8e8e8; --oninv:#141414;
  --red:#ff6b6b; --orange:#ff9d4d; --amber:#ffc24d; --blue:#7db8ff; --green:#e8e8e8; --grn:#6fcf8a; --pink:#ff9ad3; --purple:#c9a0ff; --teal:#3ee0cf;
  --redline:#ff6b6b; --focus:#ffc24d; color-scheme:dark;
}
:root[data-cad="dark"]{
  --bg:#141414; --s1:#1a1a1a; --s2:#262626; --line:#3a3a3a; --line2:#3a3a3a; --nav:#141414;
  --ink:#e8e8e8; --ink2:#cfcfcf; --ink3:#aaaaaa; --inv:#e8e8e8; --oninv:#141414;
  --red:#ff6b6b; --orange:#ff9d4d; --amber:#ffc24d; --blue:#7db8ff; --green:#e8e8e8; --grn:#6fcf8a; --pink:#ff9ad3; --purple:#c9a0ff; --teal:#3ee0cf;
  --redline:#ff6b6b; --focus:#ffc24d; color-scheme:dark;
}
:root[data-cad="light"]{
  --bg:#f7f7f4; --s1:#fdfdfb; --s2:#ebebe6; --line:#d2d2cb; --line2:#d2d2cb; --nav:#f7f7f4;
  --ink:#1a1a1a; --ink2:#333333; --ink3:#595959; --inv:#1a1a1a; --oninv:#f7f7f4;
  --red:#c4001a; --orange:#b34700; --amber:#8a5300; --blue:#0044cc; --green:#1a1a1a; --grn:#1f7a3d; --pink:#b0105f; --purple:#6a2fb8; --teal:#00706a;
  --redline:#c4001a; --focus:#0044cc; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f);-webkit-text-size-adjust:100%}
body.has-mini{--minih:66px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.lab{font-size:12px;color:var(--ink3)}
.lab.t{letter-spacing:0;text-transform:none;font-size:12px;color:var(--ink2)}
.qrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink);padding:0 16px 10px}
.qrow span:last-child{color:var(--ink3)}
.tag{font-size:12px;letter-spacing:0;text-transform:none;font-weight:500}.sub{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}.sd{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.bad{color:var(--red)}.warn{color:var(--ink);font-weight:500}.ok{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;letter-spacing:0;text-transform:none;background:transparent;border:1px solid var(--line2);border-radius:6px;color:var(--ink2);padding:0 14px;min-height:36px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--oninv);font-weight:500}
.btn.go{background:var(--green);border-color:var(--green);color:var(--oninv);font-weight:500}
.btn.danger{color:var(--red)}
.btn.tall{min-height:46px}
.btn.big{min-height:52px;font-size:13px;color:var(--ink)}
.btn.dash{border-style:dashed;min-height:44px;color:var(--ink3);width:100%}
.btn.sm{min-height:30px;padding:0 10px}
.inp{background:var(--s1);border:1px solid var(--line2);border-radius:6px;color:var(--ink);padding:0 12px;min-height:46px;min-width:0;font-size:16px;width:100%}
.inp:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.inp::placeholder{color:var(--ink3)}
select.inp{font-size:14px;padding-right:8px}
textarea.inp{padding:10px 12px;min-height:90px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;border-right:1px solid var(--line2);color:var(--ink2);min-height:44px;font-size:13px;letter-spacing:0;text-transform:none}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--oninv);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;letter-spacing:0;text-transform:none;border:1px solid var(--line2);border-radius:6px;padding:0 12px;min-height:34px;background:transparent;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--oninv);font-weight:500}
.cbl{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.cbl input{width:20px;height:20px;accent-color:var(--green);margin:0;flex:none}

.hd{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hin{display:flex;align-items:center;gap:8px;padding:12px 16px;max-width:560px;margin:0 auto;min-height:60px}
.brand{font-size:13px;color:var(--ink2);margin-right:auto;background:none;border:0;padding:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none;display:inline-block}
.dot.ok{background:var(--green)}.dot.busy{background:var(--amber)}.dot.err{background:var(--red)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nb{flex:1;background:none;border:0;min-height:var(--navh);font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink3);padding:0}
.nb[aria-current="page"]{color:var(--green);font-weight:500;box-shadow:inset 0 2px 0 var(--green)}
.nb kbd{display:none}
#mini{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 8px);z-index:25;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--green);border-radius:8px;padding:6px 8px 6px 12px}
#mini .go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;min-height:40px;text-align:left}
#mini b{font-size:18px;font-variant-numeric:tabular-nums}
#mini .tt{flex:1;min-width:0;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{max-width:560px;margin:0 auto;padding:18px 16px calc(var(--navh) + var(--minih) + 96px)}
.view{display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:10px}
.addbar{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}.addbar .inp{background:var(--bg)}.addbar .seg button{min-height:38px}.welcome{display:flex;flex-direction:column;gap:14px;padding:28px 4px}.welcome h2{margin:0;font-size:18px;font-weight:700}.welcome p{margin:0;color:var(--ink2);line-height:1.6}.welcome ol{margin:0;padding-left:20px;color:var(--ink2);line-height:1.9}.syn{background:none;border:0;padding:0 8px;min-height:36px;display:inline-flex;align-items:center}
.ar{display:flex;gap:8px}
.ar .grow{flex:1}
.card{background:var(--s1);border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:opacity .18s,transform .18s}
.sc{box-shadow:inset 3px 0 0 var(--sc)}
.card.out{opacity:0;transform:translateX(18px)}
.cb{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px}
.ct{font-size:15px;line-height:1.45;background:none;border:0;padding:0;text-align:left;color:var(--ink);overflow-wrap:anywhere}
.vrow{display:flex;border-top:1px solid var(--line)}
.v{flex:1;min-width:0;background:transparent;border:0;border-right:1px solid var(--line);min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;letter-spacing:0;text-transform:none;font-weight:500;padding:0;color:var(--ink)}
.v:last-child{border-right:0}
.v:hover{background:var(--s2)}
.v span{font-weight:400;color:var(--ink3);font-size:11px;letter-spacing:0;text-transform:none}
.v.one{flex-direction:row}
.card.picking{border-color:var(--green)}
.hw{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:8px 10px 8px 12px;min-height:60px}
.hw.over{border-color:var(--redline)}
.hw.donev{background:transparent}
.hb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;background:none;border:0;padding:4px 0;text-align:left;color:var(--ink)}
.hb .tt{font-size:14px;overflow-wrap:anywhere}
.hb .tt.x{color:var(--ink3);text-decoration:line-through}
.chk{width:26px;height:26px;border:2px solid var(--ink2);border-radius:4px;flex:none;background:none;padding:0;display:grid;place-items:center;font-weight:700;color:var(--oninv);position:relative}
.chk::after{content:'';position:absolute;inset:-10px}
.chk[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.chk[aria-pressed="true"]::before{content:'✓';font-size:15px;line-height:1}
.trow{display:flex;align-items:center;gap:10px;width:100%;background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:0 12px;min-height:52px;text-align:left;color:var(--ink)}
.trow:hover{border-color:var(--line2)}
.trow .tn{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;font-size:12px;letter-spacing:0;text-transform:none;border:1px solid var(--line2);border-radius:4px;padding:3px 8px;white-space:nowrap;color:var(--ink2)}
.pill.nd{border-style:dashed;color:var(--ink3)}

.pill.td{color:var(--green);border-color:var(--green);font-weight:500}
.pill.od{color:var(--red);border-color:var(--red)}
.gh{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.bar{height:4px;background:var(--s2);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);transition:width .3s}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:26vh;text-align:center}
details.fold{border-top:1px solid var(--line)}
details.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;font-size:13px;color:var(--ink2);cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'+';font-size:14px}
details.fold[open]>summary::after{content:'−'}
details.fold>.fb{padding:0 0 14px;display:flex;flex-direction:column;gap:6px}
.lk{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;background:none;border:0;border-top:1px solid var(--line);padding:0;font-size:13px;color:var(--ink2)}
.dayr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.dayr span:last-child{color:var(--ink2);text-align:right}
.cd{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.cd b{font-size:28px;line-height:1;font-weight:500;color:var(--green)}
.today{display:flex;flex-direction:column;gap:24px}
.colL,.colR{display:contents}
.o0{order:0}.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.hw .btn.sm,.pstep .btn.sm{border-color:transparent;color:var(--ink3)}.hw .btn.sm:hover,.pstep .btn.sm:hover{color:var(--ink)}

.mins{display:flex;align-items:center;justify-content:center;gap:18px;padding-top:10px}
.step{width:56px;height:56px;border-radius:50%;border:1px solid var(--line2);background:transparent;font-size:18px;font-weight:700;color:var(--ink);padding:0;flex:none}
.minin{width:150px;text-align:center;font-size:76px;font-weight:700;line-height:1;background:transparent;border:0;border-bottom:2px solid var(--line2);color:var(--ink);padding:4px 0;-moz-appearance:textfield;appearance:textfield}
.minin::-webkit-inner-spin-button,.minin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.minin:focus{outline:none;border-bottom-color:var(--focus)}
.pre{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pre button{min-height:44px;border:1px solid var(--line2);border-radius:4px;background:transparent;color:var(--ink2);font-size:14px;padding:0}
.pre button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--oninv);font-weight:500}
.clock{font-size:clamp(64px,24vw,104px);font-weight:700;line-height:1;letter-spacing:-.02em;text-align:center;font-variant-numeric:tabular-nums}
.c3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats b{display:block;font-size:20px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:100px}
.days div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.days i{display:block;width:100%;background:var(--line2);border-radius:2px;min-height:2px}
.days .now i{background:var(--green)}
.srow{display:grid;grid-template-columns:minmax(80px,34%) 1fr 56px;gap:10px;align-items:center;font-size:12px}
.srow span:last-child{text-align:right}

dialog{padding:0;border:0;border-top:1px solid var(--line2);background:var(--s1);color:var(--ink);width:100%;max-width:100%;margin:auto 0 0;border-radius:14px 14px 0 0;max-height:92dvh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.72)}
.sh{padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;max-width:560px;margin:0 auto}
.sh h2{margin:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.sh .inp{background:var(--s2)}
.acts{display:flex;gap:8px}
.acts .btn{min-height:46px}
.acts .btn.pri{flex:1}
.famg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.famg button{min-height:58px;border:1px solid var(--line2);border-radius:6px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;padding:0}
.famg button span{font-size:12px;font-weight:400;color:var(--ink2);text-transform:none}
.famg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--oninv)!important}
.famg button[aria-pressed="true"] span{color:var(--oninv)}
.dater{display:flex;gap:8px}
.dater .btn{width:56px;padding:0;min-height:46px;flex:none}
.dater .inp{text-align:center;font-weight:700}
.note{font-size:12px;line-height:1.55;color:var(--ink2);display:flex;flex-direction:column;gap:4px;margin:0}
.swat{display:flex;flex-wrap:wrap;gap:8px}
.swat button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.swat button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--s1)}
.stl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);text-align:right}
a{color:var(--blue)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + var(--minih) + env(safe-area-inset-bottom,0px) + 10px);z-index:40;max-width:536px;margin:0 auto;background:var(--inv);color:var(--oninv);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast b{margin-right:auto}
#toast button{background:none;border:0;padding:4px 0;min-height:32px;color:var(--oninv);text-decoration:underline;text-underline-offset:3px;font-size:12px}

.skrow{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.skl{display:flex;flex-direction:column;gap:3px;min-width:0}
.skw{font-size:15px;font-weight:700;color:var(--amber);display:inline-block;transform-origin:left center}
.skrow.risk .skw{color:var(--ink)}
.up{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.2)}100%{transform:scale(1)}}
.dots{display:flex;gap:3px;margin-left:auto;flex:none}
.dots i{display:block;width:9px;height:9px;border-radius:2px;background:var(--s2);border:1px solid var(--line2)}
.dots i.on{background:var(--green);border-color:var(--green)}
.dots i.td{outline:1px solid var(--ink);outline-offset:1px}
.skc{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--line2);border-radius:4px;min-height:36px;padding:0 9px;color:var(--ink3);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.skc.on{color:var(--amber);border-color:var(--amber)}
.skc svg{width:13px;height:13px;fill:currentColor}
.pstep{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:10px 16px;min-height:56px}
.pstep .tt{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.dkr{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);min-height:40px;padding:0;font-size:13px;color:var(--ink);text-align:left}
.dkr span:last-child{color:var(--ink2);font-variant-numeric:tabular-nums}.c3 .btn{white-space:normal;line-height:1.3;padding:0 8px;text-align:center}@media (max-width:480px){.brand{font-size:12px;letter-spacing:.04em}.hin{gap:6px}.hin>.btn{padding:0 10px}}
@media (min-width:700px){
  dialog{width:min(560px,calc(100vw - 32px));margin:auto;border:1px solid var(--line2);border-radius:12px}
}
@media (min-width:900px){
  :root{--navh:0px;--hh:65px}
  body.has-mini{--minih:0px}
  .hin{max-width:1040px;padding:0 24px;gap:14px;min-height:64px}
  .brand{margin-right:18px}
  #nav{position:static;flex:1;background:none;border:0;padding:0;gap:18px}

function parseBounds(str){
  var out=String(str||'').split(',').map(function(p){var q=p.split(':');return {g:(q[0]||'').trim(),min:parseFloat(q[1])}}).filter(function(b){return b.g&&isFinite(b.min)});
  out.sort(function(a,b){return b.min-a.min});
  return out.length>=2?out:parseBounds(BOUNDS);
}
var pctOf=function(a){return a.mark/a.max*100};
var fmtPct=function(n){return (Math.round(n*10)/10)+'%'};
function gradeFor(pct){var b=parseBounds(state.settings.bounds);for(var i=0;i<b.length;i++)if(pct>=b[i].min)return b[i].g;return b[b.length-1].g}
function catAvg(list){
  var W=0,T=0;list.forEach(function(a){W+=a.weight;T+=a.weight*pctOf(a)});
  return W?{avg:T/W,w:W,n:list.length}:null;
}
function subGrade(id){
  var all=state.grades.filter(function(a){return a.sub===id}),S=state.settings;
  var f=catAvg(all.filter(function(a){return a.kind==='formative'})),m=catAvg(all.filter(function(a){return a.kind==='summative'}));
  var fw=Math.max(0,+S.gradeF||0),sw=Math.max(0,+S.gradeS||0),pct=null;
  if(f&&m)pct=fw+sw>0?(f.avg*fw+m.avg*sw)/(fw+sw):(f.avg+m.avg)/2;
  else if(m)pct=m.avg;else if(f)pct=f.avg;
  return {all:all,f:f,m:m,pct:pct,grade:pct===null?null:gradeFor(pct),fw:fw,sw:sw};
}
// Mark needed on the next summative (weight 1) to reach a given overall percentage.
function neededFor(g,target){
  var f=g.f,m=g.m,fw=g.fw,sw=g.sw;
  if(!f&&!m)return null;
  if(m&&!f)return target*(m.w+1)-m.avg*m.w;
  if(sw<=0)return null;
  var base=(target*(fw+sw)-(f?f.avg*fw:0))/sw;
  return m?base*(m.w+1)-m.avg*m.w:base;
}
function nextBound(pct){
  var up=parseBounds(state.settings.bounds).filter(function(b){return b.min>pct});
  return up.length?up[up.length-1]:null;
}
function gradeCard(id){
  var g=subGrade(id);
  if(g.pct===null)return '<div class="card"><div class="cb"><span class="lab">Grade</span><span class="lab t">No results yet. Add a formative or summative mark to work out a grade.</span></div></div>';
  var nb=nextBound(g.pct),need=nb?neededFor(g,nb.min):null,hint='';
  if(nb&&need!==null)hint=need>100?'Grade '+esc(nb.g)+' needs more than one summative to reach':need<=0?'':'Grade '+esc(nb.g)+' needs '+fmtPct(need)+' on your next summative';
  else if(!nb)hint='Top grade';
  return '<div class="card"><div class="cb"><div class="gtop"><div class="gbig">'+esc(g.grade)+'</div><div class="gmeta"><b>'+fmtPct(g.pct)+'</b><span class="lab t">'+plural(g.all.length,'result')+'</span></div></div>'+
    '<div class="g2"><div class="mini"><span class="lab">Formative · '+g.fw+'%</span><b>'+(g.f?fmtPct(g.f.avg):'None yet')+'</b></div><div class="mini"><span class="lab">Summative · '+g.sw+'%</span><b>'+(g.m?fmtPct(g.m.avg):'None yet')+'</b></div></div>'+
    (hint?'<span class="lab t">'+hint+'</span>':'')+'</div></div>';
}
function gradeRow(a){
  var pc=pctOf(a);
  return '<button class="trow" data-a="edit-grade" data-id="'+a.id+'"><span class="tn">'+esc(a.title||(a.kind==='formative'?'Formative':'Summative'))+'</span><span class="pill">'+(a.kind==='formative'?'Formative':'Summative')+'</span><span class="num" style="flex:none;min-width:92px;text-align:right">'+esc(+a.mark.toFixed(2))+' / '+esc(a.max)+' · '+Math.round(pc)+'%</span></button>';
}

    brk:[function(){return 'Break over, sloth. Back to it.'}]
  }
};
function canNotify(){return 'Notification' in window&&Notification.permission==='granted'}
function askNotify(){
  if(!('Notification' in window))return Promise.resolve('unsupported');
  if(Notification.permission!=='default')return Promise.resolve(Notification.permission);
  return Notification.requestPermission();
}
function showNote(body,tag,force){
  if((!force&&!state.settings.notify)||!canNotify())return;
  var o={body:body,tag:tag,renotify:true};
  if(swReg){swReg.showNotification('Study planner',o).catch(function(){});return}
  try{var n=new Notification('Study planner',o);n.onclick=function(){window.focus();n.close()}}catch(e){}
}
function noteCtx(){
  var t0=today(),items=dueReviews(t0).concat(dueStarts(t0),dueTasks(t0));
  var tm=state.tests.filter(function(x){return x.kind!=='project'&&diff(t0,x.date)===1})[0];
  return {n:items.length,first:items[0]?items[0].title:'',s:streak(),test:tm?tm.title:''};
}
function noteText(tone,kind,c){var set=MSG[tone]||MSG.normal;return pick(set[kind]||MSG.normal[kind])(c)}
function notifyTimer(t){
  var kind=t.mode==='break'?'brk':'focus';
  showNote(noteText(state.settings.notifyTone,kind,{title:t.title}),'timer');
}
var hmMins=function(hm){var p=String(hm||'').split(':');return (+p[0]||0)*60+(+p[1]||0)};
function checkNotify(){
  var S=state.settings;if(!S.notify||!canNotify())return;
  var now=new Date(),t0=today(),m=now.getHours()*60+now.getMinutes(),sent;
  try{sent=JSON.parse(localStorage.getItem(NKEY)||'{}')}catch(e){sent={}}
  if(sent.d!==t0)sent={d:t0};
  var looking=!document.hidden&&document.hasFocus(),c=noteCtx(),at=hmMins(S.notifyAt),late=Math.max(at+180,21*60);
  // Each reminder fires once a day, within three hours of its time, and only when the app is not in front of you.
  if(!sent.daily&&m>=at&&m<at+180){sent.daily=1;if(c.n&&!looking)showNote(noteText(S.notifyTone,c.test?'test':'daily',c),'daily')}
  if(!sent.streak&&m>=late&&m<late+180){sent.streak=1;if(c.s&&!activeDays()[t0]&&!looking)showNote(noteText(S.notifyTone,'streak',c),'streak')}
  try{localStorage.setItem(NKEY,JSON.stringify(sent))}catch(e){}
}
var swWait='serviceWorker' in navigator&&/^https?:$/.test(location.protocol)?navigator.serviceWorker.register('sw.js').then(function(r){swReg=r},function(){}):Promise.resolve();
setInterval(checkNotify,60000);

var lastPull=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(timer&&timer.running){lockScreen(true);if(tLeft()===0)onTimerEnd()}
  if(gOn()&&Date.now()-lastPull>15000){lastPull=Date.now();gPull()}
  if(ankiOn)ankiRefresh();
  checkNotify();
  render();
});
setInterval(function(){if(!document.hidden&&gOn()&&!gBusy){lastPull=Date.now();gPull()}},120000);

shownStreak=streak();
applyTheme();
render();
if(ankiOn)ankiRefresh();
setInterval(function(){if(!document.hidden&&ankiOn)ankiRefresh()},300000);
setDot(gOn()?'busy':'off',gOn()?'Syncing':'Not connected');
if(gOn()){lastPull=Date.now();gPull()}
initCloud();
if(timer&&timer.running){lockScreen(true);if(tLeft()===0)onTimerEnd()}
swWait.then(checkNotify);
})();
</script>
